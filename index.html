<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어떤 월급이 끌리세요?</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#efeee9;color:#1d1d1b;padding:24px}
h1{font-size:26px;margin:0 0 6px;text-align:center}p.s{color:#6b6a65;margin:0 0 28px;text-align:center}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(900px,100%)}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
a.opt{display:block;text-decoration:none;border-radius:22px;padding:34px 28px;transition:transform .15s,box-shadow .15s}
a.opt:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.12)}
.a{background:#fff;color:#1d1d1b;border:1px solid #e2e0d8}.b{background:#16131f;color:#f2eefc}
.k{font-size:13px;font-weight:700;opacity:.65}
.n{font-size:36px;margin:10px 0}.a .n{font-family:'Gowun Dodum';color:#1f6f5c}.b .n{font-family:'Black Han Sans';color:#a98bff}
.d{font-size:15px;opacity:.8;line-height:1.6}
.go{display:inline-block;margin-top:20px;font-weight:700;padding:10px 16px;border-radius:12px}.a .go{background:#1f6f5c;color:#fff}.b .go{background:#6b3fd4;color:#fff}
small{margin-top:24px;color:#8a8984}
</style>
</head>
<body>
<h1>쉬는 시간, 어떤 이름으로 부를까요?</h1>
<p class="s">두 가지 컨셉 중 더 끌리는 쪽을 골라 써보세요.</p>
<div class="wrap">
  <a class="opt a" href="a.html"><div class="k">A안</div><div class="n">틈날때버는월급</div><div class="d">커피 한 잔, 스트레칭 한 번.<br>잘 쉬는 것도 일의 일부라고 말해주는 따뜻한 버전.</div><span class="go">A안 써보기 →</span></a>
  <a class="opt b" href="b.html"><div class="k">B안</div><div class="n">월급루팡</div><div class="d">월급은 회사가, 루팡은 내가.<br>등급 올리고 업종 대항전 하는 장난스러운 버전.</div><span class="go">B안 써보기 →</span></a>
</div>
<small>두 안은 기록이 따로 저장돼요 · 시연용 페이지</small>
</body>
</html>
